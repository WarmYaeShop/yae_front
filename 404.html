<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена — Yae Shop</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Анти-мигание: пока styles.css не применился, служебные слои скрыты.
         Без этого боковое меню и модалки на секунду видны «голым» списком. -->
    <style>
        html, body { background: #14101d; margin: 0; }
        .side-menu { position: fixed; top: 0; right: -380px; }
        .modal-overlay, .menu-overlay, .profile-dropdown { opacity: 0; visibility: hidden; }
        #preloader { position: fixed; inset: 0; z-index: 100000; background: #0f0c14; }
    </style>
    <!-- Шрифты с нашего сервера; предзагружаем то, что видно сразу: логотип и русский текст -->
    <link rel="preload" href="/static/fonts/marckscript-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/roboto-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <style>
        .nf { min-height: 82vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; position: relative; z-index: 5; }
        .nf-code { font-size: clamp(90px, 22vw, 170px); font-weight: bold; line-height: 1; background: linear-gradient(90deg, #ff7eb3, #ff4dff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 40px rgba(255,126,179,0.3); }
        .nf h1 { color: #fff; margin: 10px 0 6px; font-size: 26px; }
        .nf p { color: #a097b0; margin-bottom: 28px; font-size: 15px; }
        .nf a { background: linear-gradient(90deg, #ff4dff, #b300b3); color: #fff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: bold; box-shadow: 0 6px 18px rgba(179,0,179,0.3); transition: 0.25s; }
        .nf a:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(179,0,179,0.45); }
    </style>
</head>
<body>
    <div id="sakura-tree"></div>
    <div class="nf">
        <div class="nf-code">404</div>
        <h1>Упс! Страница потерялась 🌸</h1>
        <p>Возможно, ссылка устарела или такой страницы нет.</p>
        <a href="/index.html">← Вернуться на главную</a>
    </div>
</body>
</html>
